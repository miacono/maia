name: Claude Code

on:
  issues:
    types: [labeled]          # only label events — adding a label requires write access
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Security: only repository collaborators (write access or above) can trigger Claude.
    #
    # Safe triggers:
    #   1. Label "claude" added to an issue — requires write access to label
    #   2. "@claude" in a comment — gated by author_association: only OWNER / MEMBER /
    #      COLLABORATOR can trigger; CONTRIBUTOR, FIRST_TIME_CONTRIBUTOR, NONE are ignored
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJson('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))

    runs-on: ubuntu-latest

    permissions:
      contents: write        # create branches, commit, push
      pull-requests: write   # open and update PRs
      issues: write          # comment on issues with progress
      id-token: write        # OIDC (needed by the action internals)
      actions: read          # read CI results so Claude can react to failures

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 40
